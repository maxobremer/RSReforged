name: Test

# GMC fork: the upstream suite targets the dnd5e 5 code paths this fork
# replaced, so it only runs on demand.
on:
  workflow_dispatch:

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test
